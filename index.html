<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的清洁人格是什么？ · 家清双11心选清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #FFF9F3;
    --text: #1A1A1A;
    --text-light: #7A6B5D;
    --accent: #FF2D55;
    --accent-light: #FF6B35;
    --coral: #FF4F6F;
    --gold: #FFB800;
    --purple: #A855F7;
    --green: #22C55E;
    --promo-gradient: linear-gradient(135deg, #FF2D55 0%, #FF6B35 50%, #FFB800 100%);
    --warm-bg: linear-gradient(160deg, #FFF9F3 0%, #FFE8D6 40%, #FFDBB5 100%);
  }

  body {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    33% { transform: translateY(-12px) rotate(5deg); }
    66% { transform: translateY(6px) rotate(-3deg); }
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 4px 24px rgba(255,45,85,0.3); }
    50% { box-shadow: 0 8px 40px rgba(255,107,53,0.5); }
  }

  @keyframes confetti-fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(60px) rotate(360deg); opacity: 0; }
  }

  /* ===== SCREENS ===== */
  .screen { display: none; min-height: 100vh; animation: fadeIn 0.6s ease; }
  .screen.active { display: block; }

  /* ===== HERO / LANDING ===== */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 24px;
    position: relative;
    background: var(--warm-bg);
    overflow: hidden;
  }

  /* Decorative floating elements */
  .hero-deco {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .hero-deco-1 {
    width: 18px; height: 18px;
    background: rgba(255,45,85,0.15);
    top: 12%; left: 8%;
    animation: float 6s ease-in-out infinite;
  }
  .hero-deco-2 {
    width: 12px; height: 12px;
    background: rgba(255,184,0,0.2);
    top: 20%; right: 12%;
    animation: float 5s ease-in-out 1s infinite;
  }
  .hero-deco-3 {
    width: 24px; height: 24px;
    background: rgba(255,107,53,0.12);
    bottom: 25%; left: 15%;
    animation: float 7s ease-in-out 0.5s infinite;
  }
  .hero-deco-4 {
    width: 10px; height: 10px;
    background: rgba(255,45,85,0.2);
    bottom: 35%; right: 10%;
    animation: sparkle 3s ease-in-out infinite;
  }
  .hero-deco-5 {
    width: 16px; height: 16px;
    background: rgba(168,85,247,0.12);
    top: 40%; left: 5%;
    animation: float 8s ease-in-out 2s infinite;
  }
  .hero-deco-6 {
    width: 14px; height: 14px;
    background: rgba(255,184,0,0.15);
    top: 8%; right: 25%;
    animation: sparkle 4s ease-in-out 1.5s infinite;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,85,0.08) 0%, transparent 70%);
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -50px; left: -80px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,184,0,0.08) 0%, transparent 70%);
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--promo-gradient);
    border: none;
    border-radius: 100px;
    padding: 8px 24px;
    font-size: 13px;
    color: white;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 40px;
    animation: fadeIn 0.8s ease;
    box-shadow: 0 4px 16px rgba(255,45,85,0.2);
    position: relative;
    z-index: 1;
  }

  .hero-badge::before {
    content: '🔥';
    font-size: 14px;
  }

  .hero-title {
    font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
    font-size: clamp(36px, 8vw, 72px);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -1px;
    margin-bottom: 20px;
    animation: scaleIn 0.8s ease 0.2s both;
    position: relative;
    z-index: 1;
  }

  .hero-title .highlight {
    background: var(--promo-gradient);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
  }

  .hero-subtitle {
    font-size: clamp(15px, 2.5vw, 20px);
    color: var(--text-light);
    font-weight: 300;
    line-height: 1.8;
    max-width: 480px;
    margin-bottom: 48px;
    animation: slideUp 0.8s ease 0.4s both;
    position: relative;
    z-index: 1;
  }

  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--promo-gradient);
    color: white;
    border: none;
    border-radius: 100px;
    padding: 16px 44px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    animation: slideUp 0.8s ease 0.6s both, pulse-glow 2.5s ease-in-out infinite;
    font-family: inherit;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }

  .hero-cta:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 48px rgba(255,45,85,0.4);
  }

  .hero-cta svg {
    width: 20px; height: 20px;
    stroke: white;
    transition: transform 0.3s ease;
  }

  .hero-cta:hover svg { transform: translateX(4px); }

  .hero-hint {
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-light);
    opacity: 0.6;
    animation: slideUp 0.8s ease 0.8s both;
    position: relative;
    z-index: 1;
  }

  /* ===== QUIZ SCREEN ===== */
  .quiz-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 24px;
    background: var(--bg);
  }

  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 4px;
    background: var(--promo-gradient);
    transition: width 0.5s ease;
    z-index: 100;
    border-radius: 0 2px 2px 0;
  }

  .progress-text {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 32px;
    letter-spacing: 1px;
    font-weight: 500;
  }

  .question-card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    animation: scaleIn 0.5s ease;
  }

  .question-emoji { font-size: 48px; margin-bottom: 20px; }

  .question-text {
    font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 36px;
    color: var(--text);
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option-btn {
    background: white;
    border: 2px solid rgba(255,45,85,0.08);
    border-radius: 16px;
    padding: 16px 20px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .option-btn:hover {
    border-color: var(--accent);
    background: rgba(255,45,85,0.03);
    transform: translateX(4px);
    box-shadow: 0 4px 20px rgba(255,45,85,0.08);
  }

  .option-btn:active { transform: scale(0.98); }

  .option-letter {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,45,85,0.08);
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s ease;
  }

  .option-btn:hover .option-letter {
    background: var(--accent);
    color: white;
  }

  /* ===== RESULT SCREEN ===== */
  .result-screen {
    min-height: 100vh;
    padding: 60px 24px 80px;
    background: linear-gradient(180deg, #FFE8D6 0%, #FFF3E8 20%, var(--bg) 50%);
  }

  .result-header {
    text-align: center;
    max-width: 560px;
    margin: 0 auto 48px;
    animation: scaleIn 0.6s ease;
  }

  .result-label {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 3px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .result-emoji { font-size: 64px; margin-bottom: 16px; }

  /* ===== CAT AVATAR ===== */
  .cat-avatar-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 20px;
  }
  .cat-avatar-bg {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: scaleIn 0.6s ease 0.1s both;
    position: relative;
  }
  .cat-avatar-bg img {
    width: 130px;
    height: 130px;
    object-fit: contain;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
    animation: float 4s ease-in-out infinite;
  }
  .cat-accessory {
    position: absolute;
    font-size: 28px;
    animation: sparkle 2s ease-in-out infinite;
  }
  .cat-accessory-1 { top: -4px; right: 8px; animation-delay: 0s; }
  .cat-accessory-2 { bottom: 8px; left: -8px; animation-delay: 0.7s; }
  .cat-accessory-3 { top: 12px; left: -4px; animation-delay: 1.3s; font-size: 22px; }

  .result-title {
    font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 12px;
  }

  .result-slogan {
    font-size: clamp(16px, 2.5vw, 20px);
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .result-cta {
    display: inline-block;
    margin-top: 28px;
    font-size: 15px;
    color: white;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 14px 36px;
    background: var(--promo-gradient);
    border: none;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(255,45,85,0.25);
  }

  .result-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(255,45,85,0.4);
  }

  .result-desc {
    font-size: 15px;
    color: var(--text-light);
    line-height: 1.8;
    max-width: 440px;
    margin: 0 auto;
  }

  .result-desc:first-of-type { margin-top: 16px; }
  .result-desc + .result-desc { margin-top: 10px; }

  /* ===== PRODUCT SECTIONS ===== */
  .product-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 0;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid rgba(255,45,85,0.1);
  }

  .section-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .section-title {
    font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
    font-size: 22px;
    font-weight: 700;
  }

  .section-subtitle {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* Product cards grid */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 16px;
  }

  .product-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,45,85,0.06);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }

  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(255,45,85,0.1);
  }

  .product-card a {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .product-img {
    width: 100%;
    aspect-ratio: 1;
    background: #fafafa;
    overflow: hidden;
  }

  .product-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .product-info { padding: 16px; }

  .product-brand {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--text-light);
    margin-bottom: 4px;
  }

  .product-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .product-price {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }

  .price-current {
    font-size: 18px;
    font-weight: 900;
    font-family: 'Songti SC', 'STSong', serif;
  }

  .price-original {
    font-size: 12px;
    color: var(--text-light);
    text-decoration: line-through;
  }

  .product-offer {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 6px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .product-quote {
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.5;
    font-style: italic;
    border-top: 1px solid rgba(255,45,85,0.08);
    padding-top: 10px;
  }

  .product-quote::before { content: '\201C'; }
  .product-quote::after { content: '\201D'; }

  /* Placeholder cards */
  .placeholder-card {
    background: white;
    border-radius: 16px;
    border: 2px dashed rgba(255,45,85,0.12);
    padding: 40px 20px;
    text-align: center;
    color: var(--text-light);
    font-size: 14px;
    line-height: 1.6;
  }

  .placeholder-card .ph-icon {
    font-size: 32px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  /* ===== RETAKE BUTTON ===== */
  .retake-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 100px;
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    margin-top: 40px;
  }

  .retake-btn:hover {
    background: var(--accent);
    color: white;
  }

  /* ===== FOOTER ===== */
  .footer {
    text-align: center;
    padding: 60px 24px;
    background: linear-gradient(180deg, #1A1A1A 0%, #2D1F1F 100%);
    color: white;
  }

  .footer-title {
    font-family: 'Songti SC', 'STSong', serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
    background: var(--promo-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .footer-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto 24px;
  }

  .footer-note {
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
  }

  /* ===== PERSONALITY COLORS ===== */
  .personality-1 .result-title { color: var(--accent); }
  .personality-1 .section-icon { background: rgba(255,45,85,0.1); }
  .personality-1 .price-current { color: var(--accent); }
  .personality-1 .product-offer { background: rgba(255,45,85,0.08); color: var(--accent); }

  .personality-2 .result-title { color: var(--coral); }
  .personality-2 .section-icon { background: rgba(255,79,111,0.1); }
  .personality-2 .price-current { color: var(--coral); }
  .personality-2 .product-offer { background: rgba(255,79,111,0.08); color: var(--coral); }

  .personality-3 .result-title { color: #E8850A; }
  .personality-3 .section-icon { background: rgba(255,184,0,0.12); }
  .personality-3 .price-current { color: #E8850A; }
  .personality-3 .product-offer { background: rgba(255,184,0,0.1); color: #E8850A; }

  .personality-4 .result-title { color: var(--purple); }
  .personality-4 .section-icon { background: rgba(168,85,247,0.1); }
  .personality-4 .price-current { color: var(--purple); }
  .personality-4 .product-offer { background: rgba(168,85,247,0.08); color: var(--purple); }

  .personality-5 .result-title { color: var(--green); }
  .personality-5 .section-icon { background: rgba(34,197,94,0.1); }
  .personality-5 .price-current { color: var(--green); }
  .personality-5 .product-offer { background: rgba(34,197,94,0.08); color: var(--green); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .hero { padding: 40px 16px; min-height: 90vh; }
    .hero-title { font-size: 28px !important; }
    .hero-subtitle { font-size: 14px !important; }
    .hero-cta { padding: 14px 32px; font-size: 15px; }

    .quiz-screen { padding: 30px 16px; }
    .question-text { font-size: 20px; }
    .option-btn { padding: 12px 16px; font-size: 13px; gap: 10px; }
    .option-letter { width: 28px; height: 28px; font-size: 13px; }

    .result-screen { padding: 40px 16px 60px; }
    .result-title { font-size: 26px !important; }
    .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .product-info { padding: 10px; }
    .product-name { font-size: 12px; }
    .price-current { font-size: 15px; }
    .section-title { font-size: 18px; }
  }

  @media (max-width: 400px) {
    .product-grid { grid-template-columns: 1fr; }
  }

  /* ===== SHARE CARD (hidden, for future use) ===== */
  .share-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    justify-content: center;
    align-items: center;
  }
  .share-overlay.active { display: flex; }
</style>
</head>
<body>

<!-- ==================== SCREEN 1: LANDING ==================== -->
<div class="screen active" id="screen-landing">
  <section class="hero">
    <div class="hero-deco hero-deco-1"></div>
    <div class="hero-deco hero-deco-2"></div>
    <div class="hero-deco hero-deco-3"></div>
    <div class="hero-deco hero-deco-4"></div>
    <div class="hero-deco hero-deco-5"></div>
    <div class="hero-deco hero-deco-6"></div>
    <div class="hero-badge">双11 2026 · 家清好物局</div>
    <h1 class="hero-title">
      你的<span class="highlight">清洁人格</span><br>是什么？
    </h1>
    <p class="hero-subtitle">
      4道灵魂拷问，测出你的清洁人格类型。<br>
      再根据你的家，定制专属清洁好物清单。
    </p>
    <button class="hero-cta" onclick="startQuiz()">
      开始测试
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
    <div class="hero-hint">大约需要 30 秒 · 结果可能出乎意料</div>
  </section>
</div>

<!-- ==================== SCREEN 2: QUIZ ==================== -->
<div class="screen" id="screen-quiz">
  <section class="quiz-screen">
    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
    <div class="progress-text" id="progressText"></div>
    <div class="question-card" id="questionCard">
      <!-- Dynamically filled -->
    </div>
  </section>
</div>

<!-- ==================== SCREEN 3: RESULT ==================== -->
<div class="screen" id="screen-result">
  <section class="result-screen">
    <div class="result-header" id="resultHeader">
      <!-- Dynamically filled -->
    </div>
    <div class="product-section" id="productSection">
      <!-- Dynamically filled -->
    </div>

// 根据Q2+Q3答案动态排序品类（Q2决定第一优先，Q3决定第二优先）
function reorderSections(pKey, q2Ans, q3Ans) {
  const p = personalities[pKey];
  const baseOrder = p.sectionOrder;

  let first = (q2Ans >= 0) ? q2Primary[q2Ans] : null;
  let second = (q3Ans >= 0) ? q3Primary[q3Ans] : null;

  // 如果第一优先和第二优先相同，则只提升一个
  if (first && first === second) second = null;

  let order = [...baseOrder];

  // 提升第二优先到第二位
  if (second && order.includes(second)) {
    order = [second, ...order.filter(c => c !== second)];
  }

  // 提升第一优先到第一位（覆盖第二优先的位置）
  if (first && order.includes(first)) {
    order = [first, ...order.filter(c => c !== first)];
  }

  return order.map(cat => p.sections.find(s => s.title === cat));
}

// 动态生成人格描述（组合Q1人格 + Q2场景 + Q3换季）
function buildDynamicProfile(pKey) {
  const p = personalities[pKey];

  // 组合标题标签
  const mods = [q2Modifiers[q2Answer], q3Modifiers[q3Answer]].filter(Boolean);
  const tagStr = mods.length ? ' · ' + mods.map(m => m.tag).join(' · ') : '';

  // 组合描述段落（Q2场景段 + Q3换季段）
  const paragraphs = [];
  if (q2Answer >= 0 && q2Descriptions[pKey]) {
    paragraphs.push(q2Descriptions[pKey][q2Answer]);
  }
  if (q3Answer >= 0 && q3Descriptions[pKey]) {
    paragraphs.push(q3Descriptions[pKey][q3Answer]);
  }
  // 兜底：如果Q2/Q3都未答，用基础描述
  if (!paragraphs.length) paragraphs.push(p.desc);

  return {
    name: p.name,
    tags: tagStr,
    slogan: p.slogan,
    paragraphs: paragraphs
  };
}

// ===== QUIZ LOGIC =====
let currentQuestion = 0;
let q1Result = '';    // Q1直接决定人格类型
let q2Answer = -1;    // Q2答案索引 → 品类排序第一优先
let q3Answer = -1;    // Q3答案索引 → 品类排序第二优先

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startQuiz() {
  currentQuestion = 0;
  q1Result = '';
  q2Answer = -1;
  q3Answer = -1;
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  const total = questions.length;
  const pct = ((currentQuestion) / total) * 100;

  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `第 ${currentQuestion + 1} / ${total} 题`;

  const letters = ['A', 'B', 'C', 'D', 'E'];
  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight; // trigger reflow
  card.style.animation = 'scaleIn 0.5s ease';

  card.innerHTML = `
    <div class="question-emoji">${q.emoji}</div>
    <div class="question-text">${q.text}</div>
    <div class="options">
      ${q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectOption(${i})">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt.label}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function selectOption(idx) {
  const q = questions[currentQuestion];

  // Q1：直接锁定人格类型
  if (currentQuestion === 0) q1Result = q.options[idx].pKey;
  // Q2：记录答案索引，用于品类排序
  if (currentQuestion === 1) q2Answer = idx;
  // Q3：记录答案索引，用于品类排序
  if (currentQuestion === 2) q3Answer = idx;

  currentQuestion++;

  if (currentQuestion < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function getPersonality() {
  return q1Result;
}

function showResult() {
  const pKey = getPersonality();
  const p = personalities[pKey];
  const profile = buildDynamicProfile(pKey);

  document.getElementById('progressBar').style.width = '100%';

  // Set personality color theme
  const resultScreen = document.getElementById('screen-result');
  resultScreen.className = 'screen active ' + p.color;

  // Render result header（动态组合人格+修饰标签）
  const descHTML = profile.paragraphs.map(d => `<p class="result-desc">${d}</p>`).join('');
  const avatar = catAvatars[pKey];
  document.getElementById('resultHeader').innerHTML = `
    <div class="result-label">YOUR CLEANING PERSONALITY</div>
    <div class="cat-avatar-wrap">
      <div class="cat-avatar-bg" style="background:${avatar.bg}">
        <img src="${CAT_IMG}" alt="猫天天">
        <span class="cat-accessory cat-accessory-1">${avatar.accessories[0]}</span>
        <span class="cat-accessory cat-accessory-2">${avatar.accessories[1]}</span>
      </div>
    </div>
    <div class="result-title">${profile.name}${profile.tags}</div>
    <div class="result-slogan">${profile.slogan}</div>
    ${descHTML}
    <div class="result-cta" onclick="document.getElementById('productSection').scrollIntoView({behavior:'smooth'})">看看你的清洁方案是什么 ↓</div>
  `;

  // 根据Q2+Q3答案动态排序品类
  const orderedSections = reorderSections(pKey, q2Answer, q3Answer);

  // Render product sections with placeholders
  let sectionsHTML = '';
  orderedSections.forEach((sec, i) => {
    // 使用 dynamicSubtitles 填入人格专属副标题
    const subtitle = p.dynamicSubtitles[sec.title] || sec.subtitle;
    sectionsHTML += `
      <div class="section-header">
        <div class="section-icon" style="background: ${sec.color}15">${sec.icon}</div>
        <div>
          <div class="section-title">${sec.title}</div>
          <div class="section-subtitle">${subtitle}</div>
        </div>
      </div>
      <div class="product-grid" id="grid-${pKey}-${sec.title}">
        <div class="placeholder-card">
          <div class="ph-icon">📦</div>
          商品待填充<br>
          <span style="font-size:12px;opacity:0.6">等待商品数据录入</span>
        </div>
      </div>
    `;
  });

  document.getElementById('productSection').innerHTML = sectionsHTML;
  showScreen('screen-result');
}

function retakeQuiz() {
  showScreen('screen-landing');
}

// ===== FILL PRODUCTS (for future data injection) =====
// Usage: fillProducts('p4', '应季清洁', [{brand, name, img, link, price, originalPrice, offer, quote}, ...])
// 品类名称: '应季清洁' | '分区清洁' | '专衣专洗' | '家电清洁' | '懒人工具'
function fillProducts(pKey, category, products) {
  const grid = document.getElementById(`grid-${pKey}-${category}`);
  if (!grid) return;

  // 从 dynamicSubtitles 获取颜色
  const p = personalities[pKey];
  const sec = p.sections.find(s => s.title === category);
  const color = sec ? sec.color : 'var(--accent)';

  grid.innerHTML = products.map(prod => `
    <a href="${prod.link}" target="_blank" rel="noopener" class="product-card">
      <div class="product-img">
        <img src="${prod.img}" alt="${prod.name}" loading="lazy">
      </div>
      <div class="product-info">
        <div class="product-brand">${prod.brand}</div>
        <div class="product-name">${prod.name}</div>
        <div class="product-price">
          <span class="price-current" style="color:${color}">&yen;${prod.price}</span>
          ${prod.originalPrice ? `<span class="price-original">&yen;${prod.originalPrice}</span>` : ''}
        </div>
        ${prod.offer ? `<div class="product-offer" style="background:${color}12;color:${color}">${prod.offer}</div>` : ''}
        ${prod.quote ? `<div class="product-quote">${prod.quote}</div>` : ''}
      </div>
    </a>
  `).join('');
}
